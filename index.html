<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question For You...</title>
    <!-- Importing a cute font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Deep, dark forest green gradient */
            background: linear-gradient(135deg, #0f3014, #1b5e20, #2e7d32); 
            font-family: 'Nunito', sans-serif;
            text-align: center;
            overflow: hidden; /* Prevents scrolling */
        }

        /* Floating Background Emojis */
        .floating-emoji {
            position: fixed;
            bottom: -10%;
            z-index: 0;
            opacity: 0.3; /* Keeps them subtle in the background */
            animation: floatUp linear infinite;
            filter: drop-shadow(0px 0px 5px rgba(0,0,0,0.5));
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* Different timings, sizes, and positions for each emoji */
        .e1 { left: 10%; animation-duration: 18s; animation-delay: 0s; font-size: 3rem; }
        .e2 { left: 25%; animation-duration: 22s; animation-delay: 5s; font-size: 4rem; }
        .e3 { left: 40%; animation-duration: 15s; animation-delay: 2s; font-size: 2.5rem; }
        .e4 { left: 55%; animation-duration: 25s; animation-delay: 8s; font-size: 3.5rem; }
        .e5 { left: 70%; animation-duration: 19s; animation-delay: 3s; font-size: 3rem; }
        .e6 { left: 85%; animation-duration: 21s; animation-delay: 1s; font-size: 4.5rem; }
        .e7 { left: 15%; animation-duration: 24s; animation-delay: 10s; font-size: 2.8rem; }
        .e8 { left: 80%; animation-duration: 17s; animation-delay: 6s; font-size: 3.2rem; }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); /* Stronger shadow for the darker background */
            max-width: 90%;
            width: 500px;
            z-index: 10;
            position: relative;
            min-height: 200px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #1b5e20; /* Dark forest green header */
            margin-bottom: 30px;
            font-size: 2rem;
            line-height: 1.4;
            min-height: 60px; 
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 60px; 
            opacity: 0; 
            pointer-events: none;
            transition: opacity 1s ease-in; 
        }

        .show-buttons {
            opacity: 1;
            pointer-events: auto;
        }

        button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            transition: all 0.2s ease; 
        }

        .yes-btn {
            background-color: #2e7d32; 
            color: white;
            font-size: 1.2rem;
            padding: 15px 30px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); 
            z-index: 20;
        }

        .yes-btn:hover {
            background-color: #1b5e20; 
        }

        .no-btn {
            background-color: #9e9e9e;
            color: white;
            font-size: 1.2rem;
            padding: 15px 30px;
            z-index: 30; 
        }

        .success-text {
            font-size: 1.5rem;
            color: #333;
            line-height: 1.6;
            margin-top: 0;
        }

        .highlight {
            color: #1b5e20; 
            font-weight: 800;
            font-size: 1.8rem;
        }

        /* Typewriter Blinking Cursor Effect */
        .typing-cursor::after {
            content: '|';
            color: #1b5e20;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Floating Background Emojis -->
    <div class="floating-emoji e1">🌲</div>
    <div class="floating-emoji e2">🫎</div>
    <div class="floating-emoji e3">🎵</div>
    <div class="floating-emoji e4">🐶</div>
    <div class="floating-emoji e5">🌲</div>
    <div class="floating-emoji e6">🏋️‍♂️</div>
    <div class="floating-emoji e7">✨</div>
    <div class="floating-emoji e8">🫎</div>

    <!-- Step 1: Boyfriend Question -->
    <div class="container" id="step1-container">
        <h1 id="text-step-1"></h1>
        <div class="buttons-wrapper" id="btns-1">
            <button id="yes-btn-1" class="yes-btn" onclick="handleYes(1)">Yes</button>
            <button id="no-btn-1" class="no-btn" onmouseover="moveButton(this)" ontouchstart="moveButton(this)" onclick="handleNo(1)">No</button>
        </div>
    </div>

    <!-- Step 2: The Gym Buddy Intermediate Screen -->
    <div class="container" id="step2-container" style="display: none;">
        <h1 id="text-step-2"></h1>
        <div class="buttons-wrapper" id="btns-2">
            <button class="yes-btn" onclick="handleYippee()">Yippee!</button>
        </div>
    </div>

    <!-- Step 3: Concert Date Question -->
    <div class="container" id="step3-container" style="display: none;">
        <h1 id="text-step-3"></h1>
        <div class="buttons-wrapper" id="btns-3">
            <button id="yes-btn-3" class="yes-btn" onclick="handleYes(3)">Yes</button>
            <button id="no-btn-3" class="no-btn" onmouseover="moveButton(this)" ontouchstart="moveButton(this)" onclick="handleNo(3)">No</button>
        </div>
    </div>

    <!-- Step 4: Final Celebration View -->
    <div class="container" id="success-container" style="display: none;">
        <h1 id="text-step-4-h1"></h1>
        <p class="success-text" id="text-step-4-p"></p>
    </div>

    <script>
        // The text strings we want to type out
        const string1 = "May I be your boyfriend?";
        const string2 = "Yippee.. here's to more bloody noses, endless energy drinks, and an official gym buddy! 💪";
        const string3 = "Will you join me for our first official date as boyfriend and girlfriend to see Bruno Mars on Wednesday, May 20th?";
        const string4H1 = "YAY! ❤️🎉";
        const string4P = "It's official!<br>I can't wait for our first date at the <br><span class='highlight'>Bruno Mars concert!</span>";

        // Typewriter function
        function typeWriter(elementId, htmlString, speed, callback) {
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            element.classList.add("typing-cursor"); 
            let i = 0;
            let currentHTML = "";

            function type() {
                if (i < htmlString.length) {
                    if (htmlString.charAt(i) === '<') {
                        let tag = "";
                        while (htmlString.charAt(i) !== '>' && i < htmlString.length) {
                            tag += htmlString.charAt(i);
                            i++;
                        }
                        tag += '>';
                        currentHTML += tag;
                        i++; 
                    } else {
                        currentHTML += htmlString.charAt(i);
                        i++;
                    }
                    element.innerHTML = currentHTML;
                    
                    let randomSpeed = speed + (Math.random() * 20 - 10);
                    setTimeout(type, randomSpeed);
                } else {
                    element.classList.remove("typing-cursor"); 
                    if (callback) callback();
                }
            }
            type();
        }

        // Start typing Step 1 as soon as the page loads
        window.onload = function() {
            typeWriter("text-step-1", string1, 60, function() {
                document.getElementById("btns-1").classList.add("show-buttons");
            });
        };

        let state = {
            1: { noClickCount: 0, yesFontSize: 1.2, yesPaddingV: 15, yesPaddingH: 30, noFontSize: 1.2, noPaddingV: 15, noPaddingH: 30 },
            3: { noClickCount: 0, yesFontSize: 1.2, yesPaddingV: 15, yesPaddingH: 30, noFontSize: 1.2, noPaddingV: 15, noPaddingH: 30 }
        };

        const messages = ["Are you sure?", "Really sure?", "Think again!"];

        function moveButton(btn) {
            btn.style.position = 'fixed';
            const maxX = window.innerWidth - btn.offsetWidth - 20;
            const maxY = window.innerHeight - btn.offsetHeight - 20;
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function handleNo(step) {
            let s = state[step];
            s.noClickCount++;

            const yesBtn = document.getElementById(`yes-btn-${step}`);
            const noBtn = document.getElementById(`no-btn-${step}`);

            if (s.noClickCount >= 3) {
                noBtn.innerText = "Yes";
                noBtn.className = "yes-btn"; 
                noBtn.style.position = 'static';
                noBtn.onmouseover = null;
                noBtn.ontouchstart = null;
                noBtn.onclick = function() { handleYes(step); };
                noBtn.style.fontSize = yesBtn.style.fontSize;
                noBtn.style.padding = yesBtn.style.padding;
            } else {
                noBtn.innerText = messages[s.noClickCount - 1];
                s.yesFontSize += 1.5;
                s.yesPaddingV += 15;
                s.yesPaddingH += 25;
                yesBtn.style.fontSize = s.yesFontSize + 'rem';
                yesBtn.style.padding = s.yesPaddingV + 'px ' + s.yesPaddingH + 'px';
                s.noFontSize -= 0.2;
                s.noPaddingV -= 3;
                s.noPaddingH -= 5;
                noBtn.style.fontSize = s.noFontSize + 'rem';
                noBtn.style.padding = s.noPaddingV + 'px ' + s.noPaddingH + 'px';
            }
        }

        function handleYes(step) {
            if (step === 1) {
                document.getElementById('step1-container').style.display = 'none';
                document.getElementById('step2-container').style.display = 'flex';
                
                typeWriter("text-step-2", string2, 50, function() {
                    document.getElementById("btns-2").classList.add("show-buttons");
                });

            } else if (step === 3) { 
                document.getElementById('step3-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'flex';
                
                typeWriter("text-step-4-h1", string4H1, 70, function() {
                    typeWriter("text-step-4-p", string4P, 40, function() {
                        fireConfetti();
                    });
                });
            }
        }

        function handleYippee() {
            document.getElementById('step2-container').style.display = 'none';
            document.getElementById('step3-container').style.display = 'flex';
            
            typeWriter("text-step-3", string3, 50, function() {
                document.getElementById("btns-3").classList.add("show-buttons");
            });
        }

        function fireConfetti() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#1b5e20', '#ffd700', '#ffffff', '#8bc34a'] 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#1b5e20', '#ffd700', '#ffffff', '#8bc34a'] 
                }));
            }, 250);
        }
    </script>
</body>
</html>
