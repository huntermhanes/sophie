<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question For You...</title>
    <!-- Importing a cute font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2f1, #c8e6c9); /* Forest green gradient */
            font-family: 'Nunito', sans-serif;
            text-align: center;
            overflow: hidden; /* Prevents scrolling when the button gets huge */
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            z-index: 10;
            position: relative;
            min-height: 200px; /* Keeps box size stable while typing */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #1b5e20; /* Dark forest green header */
            margin-bottom: 30px;
            font-size: 2rem;
            line-height: 1.4;
            min-height: 60px; /* Keeps space open for the text */
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 60px; 
            opacity: 0; /* Hidden initially until text finishes typing */
            pointer-events: none;
            transition: opacity 1s ease-in; /* Smooth fade in */
        }

        /* Class added via JS to reveal the buttons */
        .show-buttons {
            opacity: 1;
            pointer-events: auto;
        }

        button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            transition: all 0.2s ease; /* Faster transition so it darts away quickly */
        }

        .yes-btn {
            background-color: #2e7d32; 
            color: white;
            font-size: 1.2rem;
            padding: 15px 30px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); 
            z-index: 20;
        }

        .yes-btn:hover {
            background-color: #1b5e20; 
        }

        .no-btn {
            background-color: #9e9e9e;
            color: white;
            font-size: 1.2rem;
            padding: 15px 30px;
            z-index: 30; 
        }

        .success-text {
            font-size: 1.5rem;
            color: #333;
            line-height: 1.6;
            margin-top: 0;
        }

        .highlight {
            color: #1b5e20; 
            font-weight: 800;
            font-size: 1.8rem;
        }

        /* Typewriter Blinking Cursor Effect */
        .typing-cursor::after {
            content: '|';
            color: #1b5e20;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Step 1: Boyfriend Question -->
    <div class="container" id="step1-container">
        <h1 id="text-step-1"></h1>
        <div class="buttons-wrapper" id="btns-1">
            <button id="yes-btn-1" class="yes-btn" onclick="handleYes(1)">Yes</button>
            <button id="no-btn-1" class="no-btn" onmouseover="moveButton(this)" ontouchstart="moveButton(this)" onclick="handleNo(1)">No</button>
        </div>
    </div>

    <!-- Step 2: Concert Date Question -->
    <div class="container" id="step2-container" style="display: none;">
        <h1 id="text-step-2"></h1>
        <div class="buttons-wrapper" id="btns-2">
            <button id="yes-btn-2" class="yes-btn" onclick="handleYes(2)">Yes</button>
            <button id="no-btn-2" class="no-btn" onmouseover="moveButton(this)" ontouchstart="moveButton(this)" onclick="handleNo(2)">No</button>
        </div>
    </div>

    <!-- Step 3: Celebration View -->
    <div class="container" id="success-container" style="display: none;">
        <h1 id="text-step-3-h1"></h1>
        <p class="success-text" id="text-step-3-p"></p>
    </div>

    <script>
        // The text strings we want to type out
        const string1 = "May I be your boyfriend?";
        const string2 = "Will you join me for our first official date as boyfriend and girlfriend to see Bruno Mars on Wednesday, May 20th?";
        const string3H1 = "YAY! ❤️🎉";
        const string3P = "It's official!<br>I can't wait for our first date at the <br><span class='highlight'>Bruno Mars concert!</span>";

        // Typewriter function
        function typeWriter(elementId, htmlString, speed, callback) {
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            element.classList.add("typing-cursor"); // Adds the blinking cursor
            let i = 0;
            let currentHTML = "";

            function type() {
                if (i < htmlString.length) {
                    // This block ensures HTML tags (like <br> or <span>) type out instantly as one piece
                    if (htmlString.charAt(i) === '<') {
                        let tag = "";
                        while (htmlString.charAt(i) !== '>' && i < htmlString.length) {
                            tag += htmlString.charAt(i);
                            i++;
                        }
                        tag += '>';
                        currentHTML += tag;
                        i++; 
                    } else {
                        currentHTML += htmlString.charAt(i);
                        i++;
                    }
                    element.innerHTML = currentHTML;
                    
                    // Add slight random delay to make it look like a human is typing
                    let randomSpeed = speed + (Math.random() * 20 - 10);
                    setTimeout(type, randomSpeed);
                } else {
                    element.classList.remove("typing-cursor"); // Remove cursor when done
                    if (callback) callback();
                }
            }
            type();
        }

        // Start typing Step 1 as soon as the page loads
        window.onload = function() {
            typeWriter("text-step-1", string1, 60, function() {
                // Fade in the buttons after text finishes
                document.getElementById("btns-1").classList.add("show-buttons");
            });
        };

        let state = {
            1: { noClickCount: 0, yesFontSize: 1.2, yesPaddingV: 15, yesPaddingH: 30, noFontSize: 1.2, noPaddingV: 15, noPaddingH: 30 },
            2: { noClickCount: 0, yesFontSize: 1.2, yesPaddingV: 15, yesPaddingH: 30, noFontSize: 1.2, noPaddingV: 15, noPaddingH: 30 }
        };

        const messages = ["Are you sure?", "Really sure?", "Think again!"];

        function moveButton(btn) {
            btn.style.position = 'fixed';
            const maxX = window.innerWidth - btn.offsetWidth - 20;
            const maxY = window.innerHeight - btn.offsetHeight - 20;
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function handleNo(step) {
            let s = state[step];
            s.noClickCount++;

            const yesBtn = document.getElementById(`yes-btn-${step}`);
            const noBtn = document.getElementById(`no-btn-${step}`);

            if (s.noClickCount >= 3) {
                noBtn.innerText = "Yes";
                noBtn.className = "yes-btn"; 
                noBtn.style.position = 'static';
                noBtn.onmouseover = null;
                noBtn.ontouchstart = null;
                noBtn.onclick = function() { handleYes(step); };
                noBtn.style.fontSize = yesBtn.style.fontSize;
                noBtn.style.padding = yesBtn.style.padding;
            } else {
                noBtn.innerText = messages[s.noClickCount - 1];
                s.yesFontSize += 1.5;
                s.yesPaddingV += 15;
                s.yesPaddingH += 25;
                yesBtn.style.fontSize = s.yesFontSize + 'rem';
                yesBtn.style.padding = s.yesPaddingV + 'px ' + s.yesPaddingH + 'px';
                s.noFontSize -= 0.2;
                s.noPaddingV -= 3;
                s.noPaddingH -= 5;
                noBtn.style.fontSize = s.noFontSize + 'rem';
                noBtn.style.padding = s.noPaddingV + 'px ' + s.noPaddingH + 'px';
            }
        }

        function handleYes(step) {
            if (step === 1) {
                document.getElementById('step1-container').style.display = 'none';
                document.getElementById('step2-container').style.display = 'flex';
                
                // Type out the second question, then show buttons
                typeWriter("text-step-2", string2, 50, function() {
                    document.getElementById("btns-2").classList.add("show-buttons");
                });

            } else if (step === 2) {
                document.getElementById('step2-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'flex';
                
                // Type out the final H1, then type the paragraph, then shoot confetti!
                typeWriter("text-step-3-h1", string3H1, 70, function() {
                    typeWriter("text-step-3-p", string3P, 40, function() {
                        fireConfetti();
                    });
                });
            }
        }

        function fireConfetti() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#1b5e20', '#ffd700', '#ffffff', '#8bc34a'] 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#1b5e20', '#ffd700', '#ffffff', '#8bc34a'] 
                }));
            }, 250);
        }
    </script>
</body>
</html>
